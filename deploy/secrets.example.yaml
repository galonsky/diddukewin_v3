# Documentation only. Replace placeholders locally; never apply empty values.
# Credential values are manually maintained and are not owned by Helm, Argo CD, or Kargo.
apiVersion: v1
kind: Secret
metadata:
  name: ddw-credentials
  namespace: diddukewin
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_LOCALLY
  AWS_SECRET_ACCESS_KEY: REPLACE_LOCALLY
  BLUESKY_PASSWORD: REPLACE_LOCALLY
  MASTODON_ACCESS_TOKEN: REPLACE_LOCALLY
  SENTRY_DSN: REPLACE_LOCALLY
  API_BASKETBALL_KEY: REPLACE_LOCALLY
---
apiVersion: v1
kind: Secret
metadata:
  name: ddw-cloudflare
  namespace: diddukewin
type: Opaque
stringData:
  CLOUDFLARE_API_TOKEN: REPLACE_LOCALLY
  CLOUDFLARE_ZONE_ID: REPLACE_LOCALLY
