apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.cronjob.name }}
  labels:
    app.kubernetes.io/name: diddukewin
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  timeZone: {{ .Values.cronjob.timeZone | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.cronjob.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  suspend: {{ .Values.cronjob.suspend }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.job.backoffLimit }}
      template:
        spec:
          containers:
            - name: diddukewin
              {{- if .Values.image.digest }}
              image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
              {{- else }}
              image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
              {{- end }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              envFrom:
                - configMapRef:
                    name: {{ .Values.configMapName }}
                - secretRef:
                    name: {{ .Values.credentialsSecretName }}
                - secretRef:
                    name: {{ .Values.cloudflareSecretName }}
                    optional: true
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          restartPolicy: Never
          terminationGracePeriodSeconds: {{ .Values.job.terminationGracePeriodSeconds }}
