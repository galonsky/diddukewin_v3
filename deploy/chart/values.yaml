# Credential values belong in manually managed Secrets, never in Helm values.
image:
  repository: galonsky/diddukewin
  tag: v6.0.0
  # Published release packages set this to the image's immutable sha256 digest.
  digest: ''
  pullPolicy: IfNotPresent

deployment:
  name: diddukewin
  terminationGracePeriodSeconds: 30

configMapName: ddw-config
config:
  BLUESKY_USERNAME: diddukewin.com
  BUCKET_NAME: diddukewin
  S3_ENDPOINT_URL: https://9671957a61ab34d9080c5af695c488b7.r2.cloudflarestorage.com
  SKEETING_ENABLED: '1'
  USE_NCAA: '1'

credentialsSecretName: ddw-credentials
cloudflareSecretName: ddw-cloudflare
resources: {}
