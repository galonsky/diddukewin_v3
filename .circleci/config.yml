# Python CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-python/ for more details
#
version: 2.1
jobs:
  build:
    docker:
      - image: cimg/python:3.14.3

    working_directory: ~/repo
    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v6-uv-dependencies-{{ checksum "pyproject.toml" }}-{{ checksum
              "uv.lock" }}
            # fallback to using the latest cache if no exact match is found
            - v6-uv-dependencies-

      - run:
          name: install dependencies
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            ~/.local/bin/uv sync --frozen --group dev --group lint

      - save_cache:
          paths:
            - ./.venv
          key: v6-uv-dependencies-{{ checksum "pyproject.toml" }}-{{ checksum
            "uv.lock" }}

      - persist_to_workspace:
          root: ~/
          paths:
            - repo
            - .local/bin/uv
            - .local/bin/uvx

  unit-tests:
    docker:
      - image: cimg/python:3.14.3

    working_directory: ~/repo
    steps:
      - attach_workspace:
          at: ~/

      - run:
          name: run tests
          command: |
            ~/.local/bin/uv run --frozen pytest tests --junitxml=test-reports/pytest/junit.xml

      - store_test_results:
          path: test-reports
  ty:
    docker:
      - image: cimg/python:3.14.3

    working_directory: ~/repo
    steps:
      - attach_workspace:
          at: ~/

      - run:
          name: run ty
          command: |
            mkdir -p test-reports/ty
            ~/.local/bin/uv run --frozen --group lint ty check --output-format junit . > test-reports/ty/junit.xml

      - store_test_results:
          path: test-reports

  black:
    docker:
      - image: cimg/python:3.14.3

    working_directory: ~/repo
    steps:
      - attach_workspace:
          at: ~/

      - run:
          name: run black
          command: |
            ~/.local/bin/uv run --frozen --group lint black --check .


  helm-check:
    docker:
      - image: cimg/python:3.14.3
    working_directory: ~/repo
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: install pinned Helm
          command: bash deploy/install-helm.sh
      - run:
          name: validate chart and release packaging
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            helm lint deploy/chart
            helm template diddukewin-default deploy/chart --namespace default > /tmp/diddukewin.yaml
            uv run --frozen pytest deploy/tests --junitxml=test-reports/releases/junit.xml
      - store_test_results:
          path: test-reports/releases

  publish-release:
    docker:
      - image: cimg/python:3.14.3
    resource_class: medium
    working_directory: ~/repo
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: ~/
      - run:
          name: install pinned Helm
          command: bash deploy/install-helm.sh
      - run:
          name: publish commit image and Helm release
          command: bash deploy/publish-release.sh
      - store_artifacts:
          path: deploy/dist
          destination: release

workflows:
  version: 2
  commit-release:
    jobs:
      - build
      - unit-tests:
          requires:
            - build
      - ty:
          requires:
            - build
      - black:
          requires:
            - build
      - helm-check:
          requires:
            - build
      - publish-release:
          requires:
            - unit-tests
            - ty
            - black
            - helm-check
          filters:
            branches:
              only: master
            tags:
              ignore: /.*/
