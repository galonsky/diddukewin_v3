[project]
name = "diddukewin"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "requests>=2.34.2,<3",
    "Jinja2>=3.1.6,<4",
    "minify-html>=0.18.1,<1",
    "boto3>=1.43.83,<2",
    "python-twitter>=3.5,<4",
    "sentry-sdk>=2.68.1,<3",
    "atproto>=0.0.71,<0.1",
]

[dependency-groups]
dev = [
    "ipython>=9.17.0,<10",
    "pytest>=9.1.1,<10",
    "pre-commit>=4.6.2,<5",
    "pytest-mock>=1.10.4,<4",
    "pytest-cov>=7.1.0,<8",
    "pytest-socket>=0.8.1,<1",
    "types-requests>=2.33.0.20260712,<3",
]
lint = [
    "black>=26.5.1,<27",
    "ty>=0.0.75,<0.1",
    "types-requests>=2.33.0.20260712,<3",
]

[tool.uv]
package = false
override-dependencies = [
    # atproto 0.0.69 caps cryptography below 47, excluding security fixes in 50.
    "cryptography>=50,<51",
]
